# Конфиг генератора шкалы прогресса
# Запуск: yarn gen-threshold scripts/threshold-example.yml

threshold: 15        # сколько очков нужно набрать для получения кода

code: ОТВЕТ123       # код закрытия задания (что вводит команда в финале)

# secret: abc123def456  # раскомментируй чтобы зафиксировать секрет.
#                        # При первом запуске генерируется случайно и выводится в консоль.
#                        # Сохрани его сюда если нужно перегенерировать с теми же подписями.

bonuses:
  - value: 1         # очков за один бонус этой группы
    count: 15        # количество бонусов
    name: Монета     # базовое имя → будет «Монета-01», «Монета-02», …

  - value: 3
    count: 5
    name: Камень

  - value: 5
    count: 5
    name: Самоцвет
